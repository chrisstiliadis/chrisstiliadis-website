<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commercial Reel - Chris Stiliadis</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/custom.css">
    <!-- Mini equalizer navigation styles -->
    <style>
      /* Mini EQ navigation positioned bottom‑left */
          #mini-eq {
        --bar-width: 16px;
        --bar-gap: 6px;
        --eq-height: 80px;
        --corner: 4px;
        --lift: -10px;
        --shadow: 0 8px 16px rgba(0,0,0,0.10);
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: var(--bar-width);
        gap: var(--bar-gap);
        align-items: end;
             position: fixed;
             bottom: 20px;
             /* Offset the equalizer to the right to make room for the colour knob */
             left: 80px;
             z-index: 1000;
      }
      #mini-eq .bar {
        position: relative;
        width: var(--bar-width);
        height: var(--eq-height);
        text-decoration: none;
        transition: transform 0.3s, opacity 0.3s;
      }
      #mini-eq .bar__fill {
        width: 100%;
        height: 40%;
        border-radius: var(--corner);
        overflow: hidden;
        box-shadow: 0 4px 8px rgba(0,0,0,0.08);
        transition: transform 0.3s, box-shadow 0.3s;
        position: relative;
        isolation: isolate;
        animation: mini-updown 1.4s ease-in-out infinite;
        background: #333;
      }
      #mini-eq .bar__img {
        position: absolute;
        inset: 0;
        background-position: center;
        background-size: cover;
        filter: contrast(1.05) saturate(1.05);
      }
      #mini-eq .bar:hover .bar__fill {
        transform: translateY(var(--lift));
        box-shadow: var(--shadow);
      }

      /*
        Mini navigation title styling

        A small title sits above the mini equalizer navigation.  It
        cross‑fades between the names of the tabs as the user hovers
        over each bar.  Two layered elements are used to achieve the
        fade effect.
      */
           #mini-title {
        position: fixed;
        bottom: calc(20px + var(--eq-height) + 8px);
             /* Align the cross‑fade label above the mini equalizer (not above the knob) */
             left: 80px;
        height: 18px;
        min-width: 60px;
        z-index: 1001;
        pointer-events: none;
      }
      #mini-title .mini-layer {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 0.55rem;
        letter-spacing: 0.04em;
        /* Use a dark text color for visibility on light backgrounds and add a light text shadow for contrast */
        color: #222;
        text-shadow: 0 1px 2px rgba(255,255,255,0.6);
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      #mini-title .mini-layer.show {
        opacity: 1;
      }

  /* Colour knob styling: a small control that floats to the left of the mini equalizer.
     Turning the knob increases the distortion applied to the 808 tones. */
       #color-knob-container {
         /* Position the colour knob to the left of the mini equalizer */
         position: fixed;
         bottom: 20px;
         left: 20px;
         /* Remove the negative translation so the knob remains within the viewport */
         transform: none;
         z-index: 1000;
         display: flex;
         flex-direction: column;
         align-items: center;
         font-size: 0.55rem;
         letter-spacing: 0.04em;
         color: #222;
         text-shadow: 0 1px 2px rgba(255,255,255,0.6);
       }
  #color-knob-container .knob-label {
    margin-bottom: 2px;
  }
  #color-knob {
    -webkit-appearance: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #555;
    cursor: pointer;
    position: relative;
  }
  #color-knob::-webkit-slider-thumb {
    -webkit-appearance: none;
  }
  #color-knob::-moz-range-thumb {
    appearance: none;
  }
      @keyframes mini-updown {
        0%, 100% { height: 30%; }
        50% { height: 85%; }
      }
    </style>
</head>
<body>
    <header>
        <h1>Commercial Reel</h1>
        <p>Selected commercial projects featuring original compositions, mixes and sound design.</p>
    </header>
    <main>
        <div id="commercial-container"></div>
    </main>
    <script src="js/data.js"></script>
    <script src="js/scripts.js"></script>
    <script src="js/spotify-autoplay.js"></script>
    <!-- Mini equalizer navigation script -->
    <script>
      // Mini navigation items. A "Home" entry is added as the first element so that the
      // home page is reachable from other pages. Each item may include an image but we
      // leave the `img` property empty to keep the bars a uniform dark grey.
      const miniItems = [
        { img: "", href: "index.html",    label: "Home" },
        { img: "", href: "commercial.html", label: "Commercial" },
        { img: "", href: "artist.html",     label: "Artist" },
        { img: "", href: "podcast.html",    label: "Podcast" },
        { img: "", href: "contact.html",    label: "Contact" },
        { img: "", href: "boombox-demo.html", label: "Studio" },
        { img: "", href: "https://instagram.com", label: "Instagram" },
        { img: "", href: "#awards",       label: "Awards" },
        { img: "", href: "#about",        label: "About" }
      ];

      // Audio context and 808 playback for mini navigation.  A separate AudioContext
      // is used on each page so that hovering a bar plays a short 808 tone.  The global
      // `miniCurrentOsc` tracks the currently playing oscillator so that only one tone
      // can be heard at a time.  The distortion amount is controlled via a knob
      // labelled "colour"; increasing the knob value increases the distortion factor.
      const miniCtx = new (window.AudioContext || window.webkitAudioContext)();
      let miniCurrentOsc = null;
      let miniDistortionAmt = 2; // default distortion factor
      // Base frequencies for each bar (nine values for nine navigation items)
      const miniBaseFreqs = [48, 54, 58, 62, 66, 72, 78, 84, 90];
      // Generate a tanh-based distortion curve with variable amount
      function createDistortionCurve(amount) {
        const samples = 256;
        const curve = new Float32Array(samples);
        for (let i = 0; i < samples; i++) {
          const x = (i / (samples - 1)) * 2 - 1;
          curve[i] = Math.tanh(amount * x);
        }
        return curve;
      }
      function miniPlay808(index) {
        // Stop any previously playing tone
        if (miniCurrentOsc) {
          try { miniCurrentOsc.stop(); } catch (e) {}
          miniCurrentOsc = null;
        }
        const freq = miniBaseFreqs[index % miniBaseFreqs.length];
        // Vary duration slightly across bars
        const dur = 1.1 + (index % 3) * 0.1;
        const osc = miniCtx.createOscillator();
        osc.type = 'sine';
        const gain = miniCtx.createGain();
        const lp = miniCtx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 600;
        const shaper = miniCtx.createWaveShaper();
        shaper.curve = createDistortionCurve(miniDistortionAmt);
        const t0 = miniCtx.currentTime;
        const f0 = freq * 2.2;
        osc.frequency.setValueAtTime(f0, t0);
        osc.frequency.exponentialRampToValueAtTime(freq, t0 + 0.12);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.92, t0 + 0.6);
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.9, t0 + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.2, t0 + 0.18);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        // Connect nodes: oscillator -> distortion -> lowpass -> gain -> destination
        osc.connect(shaper);
        shaper.connect(lp);
        lp.connect(gain);
        gain.connect(miniCtx.destination);
        // Store the oscillator so it can be stopped on the next hover
        miniCurrentOsc = osc;
        osc.start(t0);
        osc.stop(t0 + dur + 0.05);
      }
      function miniResumeAndPlay(index) {
        // Resume the context and play immediately within the same user interaction.
        if (miniCtx.state === 'suspended') {
          miniCtx.resume().then(() => {
            miniPlay808(index);
          }).catch(() => {
            miniPlay808(index);
          });
        } else {
          miniPlay808(index);
        }
      }
      // Unlock the audio context on the first user gesture.  Include pointerover
      // and mousemove so that hovering counts as an interaction.
      const miniHardUnlock = () => {
        if (miniCtx.state === 'suspended') {
          miniCtx.resume();
        }
      };
      ['pointerdown','keydown','click','touchstart','pointerover','mousemove'].forEach(ev =>
        window.addEventListener(ev, miniHardUnlock, { passive: true })
      );
      document.addEventListener('DOMContentLoaded', () => {
        const miniEq = document.createElement('div');
        miniEq.id = 'mini-eq';
        document.body.appendChild(miniEq);

        // Create colour knob container and elements
        const knobContainer = document.createElement('div');
        knobContainer.id = 'color-knob-container';
        const knobLabel = document.createElement('div');
        knobLabel.className = 'knob-label';
        knobLabel.textContent = 'colour';
        const knob = document.createElement('input');
        knob.type = 'range';
        knob.id = 'color-knob';
        knob.min = 0;
        knob.max = 100;
        knob.value = 0;
        knobContainer.appendChild(knobLabel);
        knobContainer.appendChild(knob);
        document.body.appendChild(knobContainer);
        // Update distortion amount when the knob is moved
        knob.addEventListener('input', () => {
          const value = parseFloat(knob.value) / 100;
          // Map 0..1 range to 1..6 factor for distortion
          miniDistortionAmt = 1 + value * 5;
        });

        // Create a mini title container for cross‑fading tab names
        const miniTitle = document.createElement('div');
        miniTitle.id = 'mini-title';
        const miniA = document.createElement('div');
        miniA.className = 'mini-layer show';
        miniA.textContent = '';
        const miniB = document.createElement('div');
        miniB.className = 'mini-layer';
        miniB.textContent = '';
        miniTitle.appendChild(miniA);
        miniTitle.appendChild(miniB);
        document.body.appendChild(miniTitle);
        let miniShowingA = true;
        const crossfadeMini = (text) => {
          const showEl = miniShowingA ? miniB : miniA;
          const hideEl = miniShowingA ? miniA : miniB;
          showEl.textContent = text;
          showEl.classList.add('show');
          hideEl.classList.remove('show');
          miniShowingA = !miniShowingA;
        };
        const resetMini = () => {
          miniA.classList.remove('show');
          miniB.classList.remove('show');
        };

        const miniTabs = [];
        miniItems.forEach((item, index) => {
          const bar = document.createElement('a');
          bar.className = 'bar';
          bar.href = item.href;
          bar.setAttribute('aria-label', item.label);
          const fill = document.createElement('div');
          fill.className = 'bar__fill';
          // randomize animation timing for organic feel
          fill.style.animationDuration = (800 + Math.random() * 1000) + 'ms';
          fill.style.animationDelay = (Math.random() * 500) + 'ms';
          const img = document.createElement('div');
          img.className = 'bar__img';
          // Use 'none' when there is no image specified so that no placeholder background appears
          img.style.backgroundImage = item.img ? `url(${item.img})` : 'none';
          fill.appendChild(img);
          bar.appendChild(fill);
          miniEq.appendChild(bar);
          miniTabs.push(bar);
          bar.addEventListener('mouseenter', () => {
            crossfadeMini(item.label);
            miniResumeAndPlay(index);
          });
          bar.addEventListener('mouseleave', () => {
            setTimeout(() => {
              const any = miniTabs.some(t => t.matches(':hover'));
              if (!any) {
                resetMini();
              }
            }, 10);
          });
        });
      });
    </script>
</body>
</html>
